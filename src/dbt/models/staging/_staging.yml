version: 2

models:
  - name: stg_orders
    description: "Orders from the source with proper types. One row per order version, so an order_id can repeat."
    columns: 
      - name: order_id
        description: "Order identifier. Repeats once per version of the order."
        data_tests:
          - not_null
      - name: organization_id
        description: "Organization that placed the order."
        data_tests:
          - not_null:
              config:
                severity: warn
          - null_ratio_above:
              arguments:
                max_ratio: 0.04
          - relationships:
              arguments:
                to: ref('stg_organizations')
                field: organization_id
              config:
                severity: warn
      - name: status
        description: "Order status in this version: pending, approved, completed or cancelled."
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'approved', 'completed', 'cancelled']
              config:
                severity: warn
      - name: amount
        description: "Order amount in USD."
        data_tests:
          - not_null:
              config:
                severity: warn
          - positive_values:
              config:
                severity: warn
  - name: stg_order_events
    description: "Order lifecycle events from the source. One row per event."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_orders_latest')
                field: order_id
              config:
                severity: "warn"

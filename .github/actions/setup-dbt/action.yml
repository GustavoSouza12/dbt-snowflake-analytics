name: Set up dbt for Snowflake
description: >
  Install Python and dbt, validate the Snowflake connection variables, write
  the private key to an owner-only temp file and install dbt packages.
  Expects the job env to define DBT_TARGET and the SNOWFLAKE_* variables
  (except the key itself, which is passed as an input).

inputs:
  private-key:
    description: Encrypted PEM private key of the Snowflake service user.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dbt
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate connection variables
      shell: bash
      run: |
        missing=0
        for name in DBT_TARGET SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_ROLE \
                    SNOWFLAKE_DATABASE SNOWFLAKE_WAREHOUSE SNOWFLAKE_PRIVATE_KEY_PASSPHRASE; do
          if [ -z "${!name}" ]; then
            echo "::error::$name is empty. Add it to the GitHub environment used by this job (as a variable or a secret) and start a NEW run."
            missing=1
          fi
        done
        exit "$missing"

    - name: Write private key
      shell: bash
      env:
        SNOWFLAKE_PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        test -n "$SNOWFLAKE_PRIVATE_KEY" || { echo "::error::SNOWFLAKE_PRIVATE_KEY secret is empty"; exit 1; }
        umask 077
        key_path="$RUNNER_TEMP/snowflake_key.p8"
        printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$key_path"
        echo "SNOWFLAKE_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

    - name: Install dbt packages
      shell: bash
      working-directory: src/dbt
      run: dbt deps

name: CI

# Pull requests into dev or master build in isolated PR_<number>_* schemas of
# the dev database. Pushes to dev (merged PRs) rebuild the shared dev schemas.
on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  # One build per PR (newer commits cancel older runs). Shared dev builds queue
  # instead of being cancelled halfway through.
  group: ${{ github.event_name == 'pull_request' && format('dbt-pr-{0}', github.event.pull_request.number) || 'dbt-dev-shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/src/dbt
  DBT_TARGET: dev

jobs:
  checks:
    name: Offline checks
    runs-on: ubuntu-latest
    env:
      # Placeholders: dbt parse needs the profile to render but never connects.
      SNOWFLAKE_ACCOUNT: offline
      SNOWFLAKE_USER: offline
      SNOWFLAKE_ROLE: offline
      SNOWFLAKE_DATABASE: offline
      SNOWFLAKE_WAREHOUSE: offline
      SNOWFLAKE_PRIVATE_KEY_PATH: /dev/null
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: offline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: JSON seed is in sync with data/order_details.json
        run: python scripts/build_order_details_seed.py --check

      - name: dbt parse
        working-directory: src/dbt
        run: |
          dbt deps
          dbt parse

  build:
    name: dbt build (dev)
    needs: checks
    runs-on: ubuntu-latest
    environment: development
    env:
      DBT_SCHEMA_PREFIX: ${{ github.event_name == 'pull_request' && format('PR_{0}_', github.event.pull_request.number) || '' }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER || secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE || secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE || secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE || secrets.SNOWFLAKE_WAREHOUSE }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dbt
        with:
          private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: dbt build
        working-directory: src/dbt
        run: |
          echo "Building ${SNOWFLAKE_DATABASE} with schema prefix '${DBT_SCHEMA_PREFIX}'"
          dbt build --target dev

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/dbt/target/manifest.json
            src/dbt/target/run_results.json
            src/dbt/logs/dbt.log
          if-no-files-found: ignore
          retention-days: 14
